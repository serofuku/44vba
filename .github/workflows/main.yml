name: Build 44VBA ESP32-S3
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init libretro-common
          git submodule deinit 44gba-watchos || true
          git rm --cached 44gba-watchos || true

      - name: Install ESP-IDF
        run: |
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          git clone --depth 1 --branch v5.1.2 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32s3

      - name: Patch compiler flags
        run: |
          cd port-esp32s3
          grep -v "COMPILER_WARN\|COMPILER_HIDE\|COMPILER_DISABLE" sdkconfig.defaults > sdkconfig.defaults.tmp || true
          mv sdkconfig.defaults.tmp sdkconfig.defaults
          echo "CONFIG_COMPILER_DISABLE_GCC12_WARNINGS=y" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARN_WRITE_STRINGS=n" >> sdkconfig.defaults
          cat sdkconfig.defaults

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3
          idf.py set-target esp32s3
          idf.py build -DEXTRA_CXXFLAGS="-Wno-error -Wno-unused-function -Wno-implicit-fallthrough -Wno-format" 2>&1 | tee build.log
          echo "Exit code: $?"

      - name: Verify build output
        run: |
          cd port-esp32s3
          echo "=== port-esp32s3 root ==="
          ls -la
          echo "=== build/ top level ==="
          ls -la build/ || echo "NO BUILD DIR"
          echo "=== build/bootloader/ ==="
          ls -la build/bootloader/ || echo "MISSING bootloader"
          echo "=== build/partition_table/ ==="
          ls -la build/partition_table/ || echo "MISSING partition table"
          echo "=== ALL .bin files ==="
          find build -name "*.bin" | sort || echo "NO BIN FILES FOUND"
          echo "=== ALL .elf files ==="
          find build -name "*.elf" | sort || echo "NO ELF FILES FOUND"
          echo "=== CMakeLists.txt exists? ==="
          cat CMakeLists.txt || echo "NO CMakeLists.txt"

      - name: Find and merge binaries
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3

          echo "=== Searching for app binary ==="

          # Try 1: .bin directly in build/ (standard ESP-IDF output)
          APP_BIN=$(find build -maxdepth 1 -name "*.bin" 2>/dev/null | head -1)
          echo "Try 1 (build/*.bin): $APP_BIN"

          # Try 2: .elf converted — find elf and use same name with .bin
          if [ -z "$APP_BIN" ]; then
            ELF=$(find build -maxdepth 1 -name "*.elf" 2>/dev/null | head -1)
            if [ -n "$ELF" ]; then
              BASENAME="${ELF%.elf}"
              APP_BIN="${BASENAME}.bin"
              echo "Try 2 (from .elf): generating $APP_BIN from $ELF"
              esptool.py --chip esp32s3 elf2image --output "$APP_BIN" "$ELF"
            fi
          fi

          # Try 3: Any .bin not in CMakeFiles, bootloader, or partition dirs
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            APP_BIN=$(find build -name "*.bin" \
              ! -path "*/CMakeFiles/*" \
              ! -path "*/bootloader/*" \
              ! -path "*/partition*" \
              ! -path "*/CheckTypeSize/*" \
              ! -path "*/esp_idf_size/*" \
              2>/dev/null | head -1)
            echo "Try 3 (deep search): $APP_BIN"
          fi

          echo "Final app binary: $APP_BIN"

          # Validate all 3 required files
          MISSING=0
          if [ ! -f "build/bootloader/bootloader.bin" ]; then
            echo "ERROR: bootloader.bin not found!"
            MISSING=1
          fi
          if [ ! -f "build/partition_table/partition-table.bin" ]; then
            echo "ERROR: partition-table.bin not found!"
            MISSING=1
          fi
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            echo "ERROR: app binary not found!"
            MISSING=1
          fi
          if [ "$MISSING" = "1" ]; then
            echo "=== Full build dir dump for debugging ==="
            find build -type f | sort
            exit 1
          fi

          esptool.py --chip esp32s3 merge_bin \
            -o 44vba-merged.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 $APP_BIN

          echo "=== Merged binary ==="
          ls -lh 44vba-merged.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: 44vba-esp32s3
          path: port-esp32s3/44vba-merged.bin

      - name: Upload build log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: port-esp32s3/build.log
