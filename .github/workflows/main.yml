name: Build 44VBA ESP32-S3
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init libretro-common
          git submodule deinit 44gba-watchos || true
          git rm --cached 44gba-watchos || true

      - name: Install ESP-IDF
        run: |
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          git clone --depth 1 --branch v5.1.2 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32s3

      - name: Patch project files only
        run: |
          cd port-esp32s3

          echo "=== Patching sdkconfig.defaults ==="
          grep -v "COMPILER_WARN\|COMPILER_HIDE\|COMPILER_DISABLE\|WERROR\|WARNINGS_AS_ERRORS" \
            sdkconfig.defaults > sdkconfig.defaults.tmp || true
          mv sdkconfig.defaults.tmp sdkconfig.defaults
          echo "CONFIG_COMPILER_DISABLE_GCC12_WARNINGS=y" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARNINGS_AS_ERRORS=n" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARN_WRITE_STRINGS=n" >> sdkconfig.defaults
          cat sdkconfig.defaults

          echo "=== Patching CMakeLists.txt ==="
          cat CMakeLists.txt

          # Only remove -Werror if it exists as a standalone flag
          # Use word boundary safe replacement
          sed -i 's/ -Werror / /g' CMakeLists.txt
          sed -i 's/ -Werror$//g' CMakeLists.txt
          sed -i 's/"-Werror"//g' CMakeLists.txt

          # Add compile options only if not already there
          if ! grep -q "Wno-error" CMakeLists.txt; then
            # Insert after cmake_minimum_required line safely
            sed -i '/cmake_minimum_required/a \
          \
          # Disable warnings as errors\
          add_compile_options(-Wno-error -Wno-unused-but-set-variable -Wno-unused-function -Wno-implicit-fallthrough -Wno-format)' CMakeLists.txt
          fi

          echo "=== Final CMakeLists.txt ==="
          cat CMakeLists.txt

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3

          idf.py set-target esp32s3

          # Use idf.py with explicit sdkconfig override via -D
          idf.py \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" \
            build \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Last 100 lines ==="
          tail -100 build.log
          exit $BUILD_EXIT

      - name: Verify build output
        if: always()
        run: |
          cd port-esp32s3
          echo "=== Top level build ==="
          ls -la build/ || echo "NO BUILD DIR"
          echo "=== .bin files ==="
          find build -name "*.bin" | sort
          echo "=== .elf files ==="
          find build -name "*.elf" | sort
          echo "=== Bootloader ==="
          ls -la build/bootloader/ || echo "MISSING"
          echo "=== Partition table ==="
          ls -la build/partition_table/ || echo "MISSING"

      - name: Find and merge binaries
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3

          APP_BIN=""

          # Try 1: Known project names directly in build/
          for NAME in esp32s3 44vba vba gba main app port-esp32s3; do
            if [ -f "build/${NAME}.bin" ]; then
              APP_BIN="build/${NAME}.bin"
              echo "Found by name: $APP_BIN"
              break
            fi
          done

          # Try 2: Any .bin directly in build/ root
          if [ -z "$APP_BIN" ]; then
            APP_BIN=$(find build -maxdepth 1 -name "*.bin" 2>/dev/null | head -1)
            [ -n "$APP_BIN" ] && echo "Found at root: $APP_BIN"
          fi

          # Try 3: Find .elf and convert to .bin
          if [ -z "$APP_BIN" ]; then
            ELF=$(find build -maxdepth 1 -name "*.elf" 2>/dev/null | head -1)
            if [ -n "$ELF" ]; then
              APP_BIN="${ELF%.elf}.bin"
              echo "Converting ELF to BIN: $ELF -> $APP_BIN"
              esptool.py --chip esp32s3 elf2image --output "$APP_BIN" "$ELF"
            fi
          fi

          # Try 4: Deep search excluding system dirs
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            APP_BIN=$(find build -name "*.bin" \
              ! -path "*/CMakeFiles/*" \
              ! -path "*/bootloader/*" \
              ! -path "*/partition*" \
              ! -path "*/CheckTypeSize/*" \
              ! -path "*/esp_idf_size/*" \
              2>/dev/null | head -1)
            [ -n "$APP_BIN" ] && echo "Found by deep search: $APP_BIN"
          fi

          echo "=== Final app binary: $APP_BIN ==="

          MISSING=0
          [ ! -f "build/bootloader/bootloader.bin" ] && echo "ERROR: bootloader.bin missing!" && MISSING=1
          [ ! -f "build/partition_table/partition-table.bin" ] && echo "ERROR: partition-table.bin missing!" && MISSING=1
          { [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; } && echo "ERROR: app binary missing!" && MISSING=1

          if [ "$MISSING" = "1" ]; then
            echo "=== Full build dir dump ==="
            find build -type f | sort
            exit 1
          fi

          esptool.py --chip esp32s3 merge_bin \
            -o 44vba-merged.bin \
            --flash_mode dio \
            --flash_size 8MB \
            0x0000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 $APP_BIN

          echo "=== Merged binary ==="
          ls -lh 44vba-merged.bin

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 44vba-esp32s3
          path: port-esp32s3/44vba-merged.bin

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: port-esp32s3/build.log
