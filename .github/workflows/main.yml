name: Build 44VBA ESP32-S3
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init libretro-common
          git submodule deinit 44gba-watchos || true
          git rm --cached 44gba-watchos || true

      - name: Install ESP-IDF
        run: |
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          git clone --depth 1 --branch v5.1.2 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          cd ~/esp-idf
          ./install.sh esp32s3

      - name: Patch compiler flags
        run: |
          cd port-esp32s3

          # Remove conflicting entries
          grep -v "COMPILER_WARN\|COMPILER_HIDE\|COMPILER_DISABLE\|WERROR" sdkconfig.defaults > sdkconfig.defaults.tmp || true
          mv sdkconfig.defaults.tmp sdkconfig.defaults

          # Correct keys for ESP-IDF v5.1.2
          echo "CONFIG_COMPILER_DISABLE_GCC12_WARNINGS=y" >> sdkconfig.defaults
          echo "CONFIG_COMPILER_WARN_WRITE_STRINGS=n" >> sdkconfig.defaults

          echo "=== sdkconfig.defaults ==="
          cat sdkconfig.defaults

          # Also patch CMakeLists.txt to remove -Werror if present
          if grep -q "Werror" CMakeLists.txt; then
            echo "Found -Werror in CMakeLists.txt, removing..."
            sed -i 's/-Werror[^ "]*//g' CMakeLists.txt
          fi

          # Check if there's a separate compiler flags file
          echo "=== CMakeLists.txt ==="
          cat CMakeLists.txt

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3

          # Force disable Werror at cmake level
          idf.py set-target esp32s3

          # Inject flags via cmake directly
          cmake -B build \
            -DCMAKE_C_FLAGS="-Wno-error -Wno-format -Wno-unused-function -Wno-implicit-fallthrough" \
            -DCMAKE_CXX_FLAGS="-Wno-error -Wno-format -Wno-unused-function -Wno-implicit-fallthrough" \
            . || true

          idf.py build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"

          # Show last 50 lines of log for quick diagnosis
          echo "=== Last 50 lines of build ==="
          tail -50 build.log

          exit $BUILD_EXIT

      - name: Verify build output
        if: always()
        run: |
          cd port-esp32s3
          echo "=== ALL files in build/ ==="
          find build -type f | sort
          echo "=== .bin files ==="
          find build -name "*.bin" | sort
          echo "=== .elf files ==="
          find build -name "*.elf" | sort

      - name: Find and merge binaries
        run: |
          . ~/esp-idf/export.sh
          cd port-esp32s3

          # The project is named esp32s3 based on project_elf_src_esp32s3.c
          # Standard ESP-IDF output: build/<projectname>.bin and build/<projectname>.elf

          APP_BIN=""

          # Try 1: Known project name from project_elf_src_esp32s3.c
          for NAME in esp32s3 44vba vba gba main app; do
            if [ -f "build/${NAME}.bin" ]; then
              APP_BIN="build/${NAME}.bin"
              echo "Found by name: $A
